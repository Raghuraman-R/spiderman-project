<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- 🔥 MOBILE SUPPORT -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Spider Name Generator</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>🕷️ SPIDER NAME GENERATOR</h1>

    <div class="input-box">
      <input type="text" id="input" placeholder="Enter your name">
      <button onclick="startAnimation()">GO</button>
    </div>

    <!-- OUTPUT -->
    <div id="output">
      <h2 id="nameText"></h2>

      <button id="downloadBtn" onclick="downloadImage()">Download</button>
    </div>

  </div>

  <!-- 🔗 GITHUB LINK (CLEAN VERSION) -->
  <div class="github">
    <a href="https://github.com/Raghuraman-R" target="_blank">Github</a>
  </div>

  <script src="script.js"></script>

</body>
</html>
